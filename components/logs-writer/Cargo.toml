[package]
name = "logs-writer"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
futures-lite = "2"
jaws-rs = { git = "https://github.com/bettyblocks/jaws-rs.git", version = "0.1.0" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["raw_value"] }
tracing = "0.1.44"
uuid = { version = "1.8.0", features = ["v4"] }
wit-bindgen = "0.52.0"
wstd = "0.6.8"

[dev-dependencies]
anyhow = "1.0.100"
axum = "0.7.9"
bytes = "1.11.0"
reqwest = { version = "0.12.24", default-features = false, features = ["json"] }
semver = "1.0.27"
tokio = { version = "1.48.0", features = [
  "macros",
  "net",
  "rt-multi-thread",
  "time",
] }
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
wash-runtime = { git = "https://github.com/bettyblocks/wasmCloud.git", rev = "54376a3d0470dc0527e0592faa170f9c0afd861f" }
