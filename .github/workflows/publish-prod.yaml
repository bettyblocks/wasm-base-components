name: Publish WASM Components (production)
run-name: Publish build ${{ inputs.build_run_id || '(latest release)' }} components to production

# The manual release of components to production. It does not rebuild: it publishes the same
# build that already went to edge, because a rebuild is not bit-reproducible and would ship
# untested bytes.
#
# Only components go out here. The WIT packages of each build already reached production
# automatically (publish.yaml). A WIT version has no effect in production until a step or a
# service imports that version.

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Build run to publish (leave empty to use the latest release on main, from .build-run-id)"
        required: false
        type: string

jobs:
  # semantic-release writes the build's run id into .build-run-id in the release commit on main,
  # so an empty input means the latest release.
  which-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build_run_id: ${{ steps.pick.outputs.build_run_id }}

    steps:
      # Full history: the check below looks for the build's commit in main's history.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Decide which build to publish
        id: pick
        env:
          DISPATCH_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          if [ -n "$DISPATCH_RUN_ID" ]; then
            build_run_id="$DISPATCH_RUN_ID"
            echo "Using the build run given on dispatch: $build_run_id"
          elif [ -s .build-run-id ]; then
            build_run_id=$(tr -d '[:space:]' < .build-run-id)
            echo "Using the build run recorded in .build-run-id: $build_run_id"
          else
            echo "::error::no .build-run-id on main, and no build_run_id was given."
            echo "::error::.build-run-id is written by semantic-release in the release commit on main."
            exit 1
          fi

          case "$build_run_id" in
            '' | *[!0-9]*)
              echo "::error::'$build_run_id' is not a run id"
              exit 1
              ;;
          esac

          echo "build_run_id=$build_run_id" >> "$GITHUB_OUTPUT"

      # Production only takes builds that went through main, and so through review and edge.
      - name: Check the build was made from main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BUILD_RUN_ID: ${{ steps.pick.outputs.build_run_id }}
        run: |
          head_sha=$(gh run view "$BUILD_RUN_ID" --json headSha --jq '.headSha')
          if [ -z "$head_sha" ]; then
            echo "::error::build run $BUILD_RUN_ID has no head SHA — check the run id"
            exit 1
          fi

          if ! git merge-base --is-ancestor "$head_sha" HEAD 2>/dev/null; then
            echo "::error::build $BUILD_RUN_ID was made from $head_sha, which is not in main's history."
            echo "::error::Production can only publish a build whose commit reached main."
            exit 1
          fi

          echo "Build $BUILD_RUN_ID was made from $head_sha on main."

  azure-prod:
    needs: which-build
    uses: ./.github/workflows/publish-components.yaml
    secrets: inherit
    with:
      build_run_id: ${{ needs.which-build.outputs.build_run_id }}
      environment: production
      component_namespace: betty-blocks-utilities
      name_column: azure_name
