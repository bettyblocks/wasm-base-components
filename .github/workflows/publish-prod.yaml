name: Publish WASM Components to Prod Azure Registry
run-name: Publish to prod Azure registry ${{ github.event_name == 'workflow_dispatch' && '(manual)' || '(auto)' }}

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (leave empty to use latest tag)"
        required: false
        type: string

jobs:
  push-azure-prod:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        env:
          INPUT_VERSION_DISPATCH: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$INPUT_VERSION_DISPATCH" ]; then
            echo "INPUT_VERSION=$INPUT_VERSION_DISPATCH" >> $GITHUB_ENV
          else
            LATEST_TAG=$(git describe --tags --abbrev=0)
            echo "INPUT_VERSION=$LATEST_TAG" >> $GITHUB_ENV
          fi

      - uses: wasco-dev/workflows/.github/actions/install-wkg@main

      - name: Prepare environment
        run: |
          VERSION="${INPUT_VERSION}"
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Download artifacts from workflow run
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: release.yaml
          name: wasm-components-v${{ env.VERSION }}
          path: ./artifacts
          if_no_artifact_found: fail
          search_artifacts: true

      - name: Organize artifacts
        run: |
          if [ -d artifacts/components ]; then
            cp -r artifacts/components/* components/ 2>/dev/null || true
          fi
          if [ -d artifacts/target ]; then
            cp -r artifacts/target/* target/ 2>/dev/null || true
          fi

      - name: Log in to prod Azure registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.AZURE_REGISTRY }}
          username: ${{ secrets.AZURE_USERNAME }}
          password: ${{ secrets.AZURE_PASSWORD }}

      - name: Build and push WIT typings packages to prod Azure registry
        run: |
          EXIT_CODE=0
          for wit_file in wit/*/*.wit; do
            name=$(sed -nE 's/^package betty-blocks-utilities:([a-z0-9-]+).*/\1/p' "$wit_file")
            # Version comes from the WIT package declaration, not the git tag.
            wit_version=$(sed -nE 's/^package[^@]*@([^;[:space:]]+).*/\1/p' "$wit_file")
            if [ -z "$wit_version" ]; then
              echo "::warning::No @version in $wit_file; skipping $name"
              EXIT_CODE=1
              continue
            fi
            temp_directory=$(mktemp -d)
            cp "$wit_file" "$temp_directory/"

            # Create overrides for any local WIT dependencies (wit/<dep>/<dep>.wit).
            dependencies=$(grep -oP 'betty-blocks-utilities:\K[a-z0-9-]+' "$wit_file" | grep -v "$name" || true)
            if [ -n "$dependencies" ]; then
              echo "[overrides]" > "$temp_directory/wkg.toml"
              for dependency in $dependencies; do
                dependency_directory="$temp_directory/deps/$dependency"
                mkdir -p "$dependency_directory"
                cp "wit/$dependency/$dependency.wit" "$dependency_directory/"
                echo "\"betty-blocks-utilities:$dependency\" = { path = \"$dependency_directory\" }" >> "$temp_directory/wkg.toml"
              done
            fi

            wasm_file=$(cd "$temp_directory" && wkg wit build --wit-dir "." -o "$name.wasm" 2>&1)
            if [ $? -ne 0 ]; then
              echo "::warning::Failed to build WIT package $name: $wasm_file"
              EXIT_CODE=1
              continue
            fi

            IMAGE_NAME="${{ secrets.AZURE_REGISTRY }}/betty-blocks-utilities/$name"
            wkg oci push "${IMAGE_NAME}:${wit_version}" "$temp_directory/$name.wasm" || EXIT_CODE=1
          done
          exit $EXIT_CODE

      - name: Push components to prod Azure registry
        run: |
          EXIT_CODE=0
          for world_file in $(find components -name "world.wit" -path "*/wit/*" -not -path "*/deps/*" -not -path "*/test-component/*"); do
            component_directory=$(dirname "$(dirname "$world_file")")
            name=$(sed -nE 's/^package betty-blocks-utilities:([a-z0-9-]+).*/\1/p' "$world_file")
            # Version comes from the component's WIT package declaration, not the git tag.
            world_version=$(sed -nE 's/^package[^@]*@([^;[:space:]]+).*/\1/p' "$world_file")
            if [ -z "$world_version" ]; then
              echo "::warning::No @version in $world_file; skipping $name"
              EXIT_CODE=1
              continue
            fi

            wasm_file=$(find "$component_directory/build" -name "*.wasm" 2>/dev/null | head -1)
            if [ -z "$wasm_file" ]; then
              wasm_file=$(find target/wasm32-wasip2/release -name "*.wasm" 2>/dev/null | head -1)
            fi

            if [ -z "$wasm_file" ]; then
              echo "::warning::Skipped $name (no .wasm artifact found)"
              continue
            fi

            IMAGE_NAME="${{ secrets.AZURE_REGISTRY }}/betty-blocks-utilities/$name"
            wkg oci push "${IMAGE_NAME}:${world_version}" "$wasm_file" || EXIT_CODE=1
          done
          exit $EXIT_CODE

      - name: Summary
        if: always()
        run: |
          echo "## Published Components to Prod Azure Registry" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Source bundle:** \`${VERSION}\` (per-package versions taken from WIT, shown below)" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** \`${{ secrets.AZURE_REGISTRY }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          for world_file in $(find components -name "world.wit" -path "*/wit/*" -not -path "*/deps/*" -not -path "*/test-component/*"); do
            name=$(sed -nE 's/^package betty-blocks-utilities:([a-z0-9-]+).*/\1/p' "$world_file")
            world_version=$(sed -nE 's/^package[^@]*@([^;[:space:]]+).*/\1/p' "$world_file")
            IMAGE_NAME="${{ secrets.AZURE_REGISTRY }}/betty-blocks-utilities/$name"
            if [ -f "$(find "$(dirname "$(dirname "$world_file")")/build" -name "*.wasm" 2>/dev/null | head -1)" ]; then
              echo "- **$name**: \`${IMAGE_NAME}:${world_version}\`" >> $GITHUB_STEP_SUMMARY
            else
              echo "- ~$name~ (skipped)" >> $GITHUB_STEP_SUMMARY
            fi
          done
