name: Publish WASM Components (production)
run-name: Publish build ${{ inputs.build_run_id || '(latest release)' }} components to production

# The manual release of components to production. It does not rebuild: it publishes the same
# build that already went to edge, because a rebuild is not bit-reproducible and would ship
# untested bytes.
#
# Only components go out here. The WIT packages of each build already reached production
# automatically (publish.yaml). A WIT version has no effect in production until a step or a
# service imports that version.
#
# Tick the components to publish. To see which components production does not have yet, run
# preview-prod.yaml first.
# Each checkbox has the name of the component's key in the table in publish-components.yaml.
# A new component needs a new checkbox here.

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Build run to publish (leave empty to use the latest release on main, from .build-run-id)"
        required: false
        type: string
      auth:
        description: "Publish auth"
        type: boolean
        default: false
      crud:
        description: "Publish crud"
        type: boolean
        default: false
      data-api:
        description: "Publish data-api"
        type: boolean
        default: false
      upload-file:
        description: "Publish upload-file"
        type: boolean
        default: false
      pdf-generator:
        description: "Publish pdf-generator"
        type: boolean
        default: false
      http-wrapper:
        description: "Publish http-wrapper"
        type: boolean
        default: false
      log-to-stdout:
        description: "Publish log-to-stdout"
        type: boolean
        default: false
      http-mcp:
        description: "Publish http-mcp"
        type: boolean
        default: false
      logs-writer:
        description: "Publish logs-writer"
        type: boolean
        default: false
      live-announcer:
        description: "Publish live-announcer"
        type: boolean
        default: false
      http-well-known:
        description: "Publish http-well-known"
        type: boolean
        default: false
      http-webhook:
        description: "Publish http-webhook"
        type: boolean
        default: false

jobs:
  which-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build_run_id: ${{ steps.pick.outputs.build_run_id }}
      only: ${{ steps.select.outputs.only }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: ./.github/actions/pick-prod-build
        id: pick
        with:
          build_run_id: ${{ inputs.build_run_id }}

      - name: Read the ticked components
        id: select
        env:
          INPUTS: ${{ toJSON(inputs) }}
        run: |
          only=$(jq -r 'to_entries | map(select(.value == true) | .key) | join(" ")' <<<"$INPUTS")
          if [ -z "$only" ]; then
            echo "::error::no component is ticked. Tick the components to publish."
            echo "::error::To see which components production does not have yet, run 'Show unreleased components (production)'."
            exit 1
          fi
          echo "Publishing: $only"
          echo "only=$only" >> "$GITHUB_OUTPUT"

  azure-prod:
    needs: which-build
    uses: ./.github/workflows/publish-components.yaml
    secrets: inherit
    with:
      build_run_id: ${{ needs.which-build.outputs.build_run_id }}
      environment: production
      component_namespace: betty-blocks-utilities
      name_column: azure_name
      only: ${{ needs.which-build.outputs.only }}
