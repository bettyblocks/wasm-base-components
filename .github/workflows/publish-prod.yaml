name: Publish WASM Components (production)
run-name: Publish to production ${{ github.event_name == 'workflow_dispatch' && '(manual)' || '(auto)' }}

# main has no build of its own (release.yaml only runs on dev), so production republishes what
# dev built and tested — rebuilding is not bit-reproducible, so it would ship untested bytes.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Build run to publish (leave empty to use the one recorded in .build-run-id)"
        required: false
        type: string

jobs:
  # The build id travels with the source: semantic-release writes .build-run-id into the release
  # commit, so merging dev brings it along.
  which-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build_run_id: ${{ steps.pick.outputs.build_run_id }}

    steps:
      # Full history: the check below diffs main's tree against the build's dev commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide which build to publish
        id: pick
        env:
          DISPATCH_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          if [ -n "$DISPATCH_RUN_ID" ]; then
            build_run_id="$DISPATCH_RUN_ID"
            echo "Using the build run given on dispatch: $build_run_id"
          elif [ -s .build-run-id ]; then
            build_run_id=$(tr -d '[:space:]' < .build-run-id)
            echo "Using the build run recorded in .build-run-id: $build_run_id"
          else
            echo "::error::no .build-run-id in this checkout, and no build_run_id was given."
            echo "::error::.build-run-id is written by semantic-release on dev and reaches main with the release commit."
            exit 1
          fi

          case "$build_run_id" in
            '' | *[!0-9]*)
              echo "::error::'$build_run_id' is not a run id"
              exit 1
              ;;
          esac

          echo "build_run_id=$build_run_id" >> "$GITHUB_OUTPUT"

      # Prod publishes a build made on dev, so refuse one whose commit is missing component or WIT
      # changes that landed on main since. Skipped on dispatch: a rollback deliberately picks an
      # older build.
      - name: Check main has nothing the build is missing
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BUILD_RUN_ID: ${{ steps.pick.outputs.build_run_id }}
        run: |
          head_sha=$(gh run view "$BUILD_RUN_ID" --json headSha --jq '.headSha')
          if [ -z "$head_sha" ]; then
            echo "::error::build run $BUILD_RUN_ID has no head SHA — check the run id"
            exit 1
          fi

          if ! git cat-file -e "${head_sha}^{commit}" 2>/dev/null; then
            echo "::error::build $BUILD_RUN_ID was made from $head_sha, which is not in main's history."
            echo "::error::Production can only publish a build whose commit reached main."
            exit 1
          fi

          changed=$(git diff --name-only "$head_sha" HEAD -- components wit)
          if [ -n "$changed" ]; then
            echo "::error::main has component or WIT changes that build $BUILD_RUN_ID ($head_sha) does not contain:"
            echo "$changed" | sed 's/^/    /'
            echo "::error::Production republishes what dev built, so these have to go through dev to be released."
            echo "::error::To publish this build anyway, dispatch this workflow with build_run_id=$BUILD_RUN_ID."
            exit 1
          fi

          echo "main matches build $BUILD_RUN_ID ($head_sha) across components/ and wit/."

  azure-prod:
    needs: which-build
    uses: ./.github/workflows/publish-components.yaml
    secrets: inherit
    with:
      build_run_id: ${{ needs.which-build.outputs.build_run_id }}
      environment: production
      component_namespace: betty-blocks-utilities
      wit_namespace: betty-blocks-types
      name_column: azure_name
