name: CI

on:
  pull_request:
  # Runs on main only to seed the rust caches: a PR can restore caches from its base branch,
  # but never from another PR.
  push:
    branches: [main]

env:
  # No debug info: CI never needs it, and it is a large share of compile, link and cache size.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  # A PR builds only the components and WIT packages that it changes (scripts/ci-targets.sh).
  # A push to main builds all: a check that the merge broke nothing. It also keeps the caches seeded.
  list-components:
    runs-on: ubuntu-24.04
    outputs:
      components: ${{ steps.list.outputs.components }}
      wit_packages: ${{ steps.list.outputs.wit_packages }}
    steps:
      # HEAD^1 (the base branch) needs depth 2.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: List what to build
        id: list
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
        run: ./scripts/ci-targets.sh $BASE >> "$GITHUB_OUTPUT"

  wit-packages:
    needs: list-components
    if: needs.list-components.outputs.wit_packages != '[]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/install-wkg

      # Each component build reads only the WIT versions that it pins. A WIT version that no
      # component uses yet is checked only here.
      - name: Check that each changed WIT package is valid WIT
        env:
          PACKAGES: ${{ needs.list-components.outputs.wit_packages }}
        run: |
          export WKG_CONFIG_FILE="$PWD/wkg-config.toml"
          result_code=0
          for dir in $(jq -r '.[]' <<<"$PACKAGES"); do
            echo "--- $dir"
            (
              cd "$dir" &&
                ../../scripts/generate-wkg-toml.sh &&
                DOCKER_CONFIG="$(mktemp -d)" wkg wit build --wit-dir . -o "$RUNNER_TEMP/package.wasm"
            ) || {
              echo "::error::$dir: wkg wit build failed"
              result_code=1
            }
          done
          exit $result_code

  component:
    name: component (${{ matrix.component.name }})
    needs: list-components
    if: needs.list-components.outputs.components != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.list-components.outputs.components) }}
    defaults:
      run:
        working-directory: ${{ matrix.component.dir }}
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        # uses: dtolnay/rust-toolchain@stable
        uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: wasm32-wasip2
          components: clippy, rustfmt

      # Each crate under the component (e.g. logs-writer/test-component) has its own lockfile
      # and target dir, which is not always ./target (log-to-stdout sets one in .cargo/config).
      - name: Resolve cache workspaces
        id: cache-workspaces
        env:
          COMPONENT_DIR: ${{ matrix.component.dir }}
        run: |
          {
            echo 'workspaces<<EOF'
            find . -name Cargo.toml -not -path '*/target/*' -not -path '*/wit/*' -printf '%h\n' \
              | while read -r ws; do
                  target=$(cargo metadata --no-deps --format-version 1 --manifest-path "$ws/Cargo.toml" | jq -r .target_directory)
                  echo "${COMPONENT_DIR}${ws#.} -> $(realpath -m --relative-to="$ws" "$target")"
                done
            echo EOF
          } | tee -a "$GITHUB_OUTPUT"

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.component.key }}
          workspaces: ${{ steps.cache-workspaces.outputs.workspaces }}
          cache-all-crates: "true"
          # PRs only restore. Saving from every PR would evict the main caches they rely on.
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - uses: ./.github/actions/install-wkg

      - name: Install wash
        shell: bash
        run: |
          curl -fsSL https://wasmcloud.com/sh | INSTALL_DIR=/usr/local/bin bash
          wash --version

      - name: Run linting
        run: just lint

      - name: Check formatting
        run: just formatting --check

      - name: Run build
        run: just build

      - name: Run clippy checks
        run: just clippy

      - name: Run tests
        run: just test

      - name: Run integration tests
        run: just integration-test

  # Required status check: keeps a single stable name over the per-component jobs.
  # A job that the PR does not need is "skipped", and that passes. list-components must succeed:
  # when it fails, the jobs after it are also "skipped".
  run_ci:
    needs: [list-components, wit-packages, component]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check job results
        env:
          LIST: ${{ needs.list-components.result }}
          WIT: ${{ needs.wit-packages.result }}
          COMPONENT: ${{ needs.component.result }}
        run: |
          echo "list-components: $LIST, wit-packages: $WIT, component: $COMPONENT"
          if [ "$LIST" != success ]; then
            echo "::error::list-components did not succeed: $LIST"
            exit 1
          fi
          for result in "$WIT" "$COMPONENT"; do
            case "$result" in
            success | skipped) ;;
            *)
              echo "::error::One or more jobs did not succeed: $result"
              exit 1
              ;;
            esac
          done
