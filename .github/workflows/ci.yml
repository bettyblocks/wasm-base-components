name: CI

on:
  pull_request:

jobs:
  validate-source-branch:
    runs-on: ubuntu-24.04
    if: github.base_ref == 'main'
    steps:
      - name: Verify PR source is dev branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "dev" ]; then
            echo "::error::PRs to main must come from the dev branch. Got: $HEAD_REF"
            exit 1
          fi

  run_ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"
          cache-directories: |
            components/http-mcp/target
            components/http-wrapper/target
            components/logs-writer/target
            components/logs-writer/test-component/target
            components/utilities/auth/target
            components/utilities/crud/target
            components/utilities/data-api/target
            components/utilities/log-to-stdout/target
            components/utilities/upload-file/target

      - name: Install stable Rust toolchain
        # uses: dtolnay/rust-toolchain@stable
        uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: wasm32-wasip2
          components: clippy, rustfmt

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: taiki-e/install-action@v2
        with:
          tool: just, wash

      - uses: wasco-dev/workflows/.github/actions/install-wkg@main

      - name: Run component linting
        run: |
          just lint-all

      - name: Check formatting
        run: |
          just format-ci

      - name: Run component builds
        run: |
          just build-all

      - name: Run component clippy checks
        run: |
          just clippy-all

      - name: Run component tests
        run: |
          just test-all

      - name: Run component integration tests
        run: |
          just integration-test-all
