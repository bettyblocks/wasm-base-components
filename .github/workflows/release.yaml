name: Build WASM Components

on:
  push:
    branches:
      - "dev"

jobs:
  build-and-release:
    outputs:
      version: ${{ steps.version.outputs.version }}
      has_release: ${{ steps.version.outputs.has_release }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Cache Rust registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install stable Rust toolchain
        # uses: dtolnay/rust-toolchain@stable
        uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: wasm32-wasip2

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - uses: wasco-dev/workflows/.github/actions/install-wkg@main

      - name: Install wash
        shell: bash
        run: |
          curl -fsSL https://wasmcloud.com/sh | INSTALL_DIR=/usr/local/bin bash
          wash --version

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install npm dependencies
        run: bun install --frozen-lockfile

      - name: Build wasm components
        run: just build

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bunx semantic-release

      - name: Read version
        id: version
        run: |
          if [ -f .version ]; then
            echo "version=$(cat .version)" >> $GITHUB_OUTPUT
            echo "has_release=true" >> $GITHUB_OUTPUT
          else
            echo "has_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload build artifacts
        if: steps.version.outputs.has_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wasm-components-v${{ steps.version.outputs.version }}
          path: |
            **/target/wasm32-wasip2/release/*.wasm
          retention-days: 90
