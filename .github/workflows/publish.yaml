name: Publish WASM Components (after build)
run-name: >-
  Publish build ${{ github.event.workflow_run.id || inputs.build_run_id }}
  ${{ github.event_name == 'workflow_dispatch' && '(manual)' || '(auto)' }}

# This workflow contains no publishing logic. Its only job is to say *which build* to
# publish and where; publish-components.yaml does the rest, identically for every destination.
#
# Every build on main goes out here automatically:
#   - components to ghcr and the dev (edge) registry;
#   - WIT packages to every Azure zone, production included.
# Components reach production only through publish-prod.yaml, a manual dispatch.
# README.md, "Release & Publish", gives the reason.

on:
  workflow_run:
    workflows: ["Build WASM Components"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Build WASM Components run ID to publish"
        required: true
        type: string

jobs:
  ghcr:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/publish-components.yaml
    with:
      build_run_id: ${{ format('{0}', github.event.workflow_run.id || inputs.build_run_id) }}
      environment: ghcr
      registry_host: ghcr.io
      component_namespace: ${{ github.repository_owner }}
      name_column: ghcr_name
      tag_latest: true

  azure-dev:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/publish-components.yaml
    secrets: inherit
    with:
      build_run_id: ${{ format('{0}', github.event.workflow_run.id || inputs.build_run_id) }}
      environment: dev
      component_namespace: betty-blocks-utilities
      wit_namespace: betty-blocks-types
      name_column: azure_name

  azure-prod-wit:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/publish-components.yaml
    secrets: inherit
    with:
      build_run_id: ${{ format('{0}', github.event.workflow_run.id || inputs.build_run_id) }}
      environment: production
      component_namespace: betty-blocks-utilities
      wit_namespace: betty-blocks-types
      publish_components: false
      name_column: azure_name
