name: Publish WASM Components (dev)
run-name: >-
  Publish build ${{ github.event.workflow_run.id || inputs.build_run_id }} to dev
  ${{ github.event_name == 'workflow_dispatch' && '(manual)' || '(auto)' }}

# This workflow contains no publishing logic. Its only job is to say *which build* to
# publish; publish-components.yaml does the rest, identically for every destination.
#
# Note that workflow_run always executes the copy of this file on the default branch (main),
# while release.yaml executes the copy on dev. Anything both files agree on — the artifact
# name in particular — is a contract between the two branches.

on:
  workflow_run:
    workflows: ["Build WASM Components"]
    types:
      - completed
    branches:
      - dev
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Build WASM Components run ID to publish"
        required: true
        type: string

jobs:
  ghcr:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/publish-components.yaml
    with:
      build_run_id: ${{ format('{0}', github.event.workflow_run.id || inputs.build_run_id) }}
      environment: ghcr
      registry_host: ghcr.io
      component_namespace: ${{ github.repository_owner }}
      name_column: ghcr_name
      tag_latest: true

  azure-dev:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/publish-components.yaml
    secrets: inherit
    with:
      build_run_id: ${{ format('{0}', github.event.workflow_run.id || inputs.build_run_id) }}
      environment: dev
      component_namespace: betty-blocks-utilities
      wit_namespace: betty-blocks-types
      name_column: azure_name
